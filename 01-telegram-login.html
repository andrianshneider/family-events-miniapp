<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>01 — Вход организатора · Family Events</title>
<style>
:root{color-scheme:light;--paper:#fffdfb;--ink:#292433;--sub:#716879;--brand:#7952c7;--soft:#f5efff;--line:#e6dfe9;--error:#a32d45}*{box-sizing:border-box}body{margin:0;background:#f2f0f6;color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #7952c7;outline-offset:4px}[hidden]{display:none!important}.review{max-width:1160px;margin:24px auto;padding:0 16px}.review h1{font-size:22px;margin:0 0 6px}.review p{margin:0 0 16px;color:var(--sub)}.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}.controls label{display:grid;gap:4px;font-size:12px;color:var(--sub)}select{min-height:44px;padding:8px 32px 8px 12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);max-width:100%;font-size:14px}.stage{margin:auto;width:390px;max-width:100%;background:var(--paper);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 16px 50px #29243310;container-type:inline-size}.host{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:8px 20px;border-bottom:1px solid var(--line);background:#f5f1f7;font-size:13px}.host button{width:44px;height:44px;border:0;border-radius:50%;background:none;font-size:25px;color:var(--ink)}.product{padding:28px 24px 24px;min-height:730px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}.brand b{font-size:24px;background:var(--soft);color:var(--brand);border-radius:12px;width:40px;height:40px;display:grid;place-items:center}.content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 0;gap:28px}.hero .eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--sub);text-transform:uppercase}.hero h2{font-size:32px;line-height:1.15;letter-spacing:-1px;font-weight:600;margin:12px 0 16px}.hero p{font-size:15px;line-height:23px;margin:0;color:var(--sub)}.visual{margin-top:28px;display:flex;gap:8px}.visual span{font-size:25px;display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:var(--soft)}.auth{padding:22px 20px;border:1px solid var(--line);border-radius:20px;background:#fff}.auth h3{font-size:20px;line-height:27px;margin:0 0 8px;letter-spacing:-.3px}.auth p{font-size:14px;line-height:21px;color:var(--sub);margin:0 0 18px}.primary,.secondary,.text-button{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:500;border:0}.primary{background:var(--brand);color:#fff}.primary:disabled{background:#d8c9ef;color:#49385e}.secondary{background:var(--soft);color:#63409f;border:1px solid var(--line);margin-top:10px}.text-button{background:none;color:#63409f;margin-top:8px;min-height:44px;font-size:14px}.note{font-size:12px!important;line-height:18px!important;margin:12px 0 0!important}.foot{text-align:center;border-top:1px solid var(--line);padding-top:20px;color:var(--sub);font-size:13px}.foot p{margin:0 0 5px}.foot strong{font-weight:500;color:var(--ink)}.foot .text-button{margin-top:0}.error{display:flex;align-items:flex-start;gap:10px;padding:12px;background:#fff0f3;border:1px solid #edc4ce;border-radius:12px;margin:0 0 16px;color:var(--error);font-size:14px}.error p{color:inherit;margin:0}.state-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--soft);color:var(--brand);margin-bottom:16px;font-size:22px}.spinner{display:inline-block;width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:turn 1s linear infinite;flex:none}.progress{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--sub);margin:16px 0}.auth[aria-busy=true]{border-color:#d3c2ec}.statusline{font-size:12px;color:var(--sub);padding:16px 0 0}.guest-tag{display:inline-flex;padding:5px 10px;background:var(--soft);color:#63409f;border-radius:8px;font-size:12px;margin:24px 0 12px}.event{background:#eee5fa;height:112px;border-radius:18px;display:grid;place-items:center;font-size:42px;margin:18px 0}.event-info{margin:24px 0}.event-info p{color:var(--sub);margin:8px 0}.event-actions{display:grid;gap:10px}.event-actions .secondary{margin:0}.event h2{margin:0}.nav{display:flex;justify-content:space-around;padding:18px 0;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}.nav strong{color:var(--brand)}.events-heading{font-size:28px;line-height:34px;margin:30px 0 20px}.blank-card{border:1px solid var(--line);padding:24px;border-radius:18px;background:#fff}.blank-card h3{margin:0 0 8px;font-size:20px}.blank-card p{color:var(--sub);font-size:14px}.expired-context{display:grid;gap:10px;margin:24px 0 20px}.skeleton{height:18px;background:#eeeaf2;border-radius:6px}.skeleton.card{height:120px;border-radius:16px}.expiry{box-shadow:0 12px 32px #2924330d}.demo-result{border-top:1px solid var(--line);padding:12px 0 0;margin-top:20px;font-size:12px;color:var(--sub)}.announcement{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@container(min-width:650px){.product{padding:40px 48px;min-height:640px}.content{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:42px;align-items:center}.hero h2{font-size:40px;line-height:46px}.hero .visual{margin-top:32px}.foot{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:16px}.foot .text-button{width:auto}.foot p{margin:0}.auth{padding:24px}.product.single .content{display:block;max-width:400px;width:100%;margin:auto}.product.single .hero{display:none}}
@container(max-width:365px){.product{padding-left:20px;padding-right:20px}.hero h2{font-size:29px}.auth{padding:18px 16px}.primary{font-size:14px}}
@media(max-width:500px){.review{padding:0 8px}.stage{border-radius:20px}.controls{gap:8px}.controls label{width:calc(50% - 4px)}.review h1{font-size:19px}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none;border-right-color:currentColor}}
@keyframes turn{to{transform:rotate(360deg)}}
</style></head><body><main class="review"><h1>01 — Вход организатора через Telegram</h1><p>Интерактивный макет. Вход и ответы Telegram имитируются; аккаунт не подключается.</p><div class="controls"><label>Платформа<select id="platform"><option value="web">Web</option><option value="pwa">PWA</option><option value="mini">Telegram Mini App</option></select></label><label>Ширина макета<select id="width"><option>375</option><option selected>390</option><option>430</option><option value="768">Tablet · 768</option><option value="1024">Desktop · 1024</option></select></label><label>Состояние<select id="state"><option value="idle">Вход</option><option value="loading">Загрузка / проверка сессии</option><option value="waiting">Ожидание Telegram</option><option value="error">Ошибка сервиса</option><option value="offline">Нет соединения</option><option value="cancelled">Вход отменён</option><option value="blocked">Окно входа заблокировано</option><option value="timeout">Ответ не получен</option><option value="expired">Сессия истекла</option><option value="stale">Mini App: данные устарели</option><option value="events">Мои события</option><option value="guest">Гость · приглашение</option><option value="invalid">Приглашение недоступно</option></select></label><label>Ответ при попытке входа<select id="outcome"><option value="success">Успех</option><option value="error">Ошибка</option><option value="cancelled">Отмена</option><option value="offline">Нет соединения</option></select></label></div><div id="stage" class="stage"></div><div class="announcement" id="announcement" role="status" aria-live="polite"></div></main>
<script>
(()=>{const stage=document.getElementById('stage'),platform=document.getElementById('platform'),state=document.getElementById('state'),width=document.getElementById('width'),outcome=document.getElementById('outcome');let timer=null,renewing=false;const brand='<div class="brand"><b aria-hidden="true">♡</b><span>Family Events</span></div>';const hero='<div class="hero"><span class="eyebrow">Для организаторов</span><h2>Близкие люди.<br>Важные события.</h2><p>Планируйте праздники, приглашайте близких и собирайте желания в одном месте.</p><div class="visual" aria-hidden="true"><span>🎂</span><span>🎁</span><span>♡</span></div></div>';const primary=(label,action,disabled=false)=>`<button class="primary" data-action="${action}" ${disabled?'disabled':''}>${disabled?'<span class="spinner" aria-hidden="true"></span>':''}${label}</button>`;const secondary=(label,action)=>`<button class="secondary" data-action="${action}">${label}</button>`;function go(s){clearTimeout(timer);state.value=s;render();}function render(){const s=state.value,isMini=platform.value==='mini';stage.style.width=width.value+'px';const host=isMini?'<div class="host"><span><strong>Family Events</strong> · Mini App</span><button data-action="close-mini" aria-label="Закрыть Mini App">×</button></div>':'';let body='';const inviteFoot='<div class="foot"><div><strong>Вас пригласили на событие?</strong><p>Откройте ссылку из приглашения — вход не нужен.</p></div><button class="text-button" data-action="guest">Посмотреть пример приглашения</button></div>';let panel='';
if(s==='events'){body=`${brand}<h2 class="events-heading">Мои события</h2><div class="blank-card"><h3>Начните с первого события</h3><p>Встреча с друзьями, семейный праздник или поездка — соберите близких вместе.</p>${primary('Создать событие','create-event')}</div><div class="demo-result" role="status">${renewing?'Вы снова вошли. Можно продолжить работу.':'Вход выполнен. Вы в пространстве организатора.'}</div><div style="flex:1"></div><div class="nav"><strong>Мои события</strong><span>Календарь</span><span>Вишлисты</span></div>`;}
else if(s==='guest'){body=`${brand}<span class="guest-tag">Приглашение · без регистрации</span><h2 class="events-heading" style="margin-top:0">Семейный праздник</h2><div class="event" aria-hidden="true">🎉</div><div class="event-info"><p>Дата и место указаны организатором</p><p>Здесь доступны детали события и ответ на приглашение.</p></div><div class="event-actions">${primary('Я приду','rsvp')}${secondary('Не смогу прийти','decline')}</div><p class="note" id="guest-status" role="status" aria-live="polite">Вход в Telegram не требуется.</p><div style="flex:1"></div><button class="text-button" data-action="organizer">Я организатор — войти</button>`;}
else if(s==='invalid'){panel=`<div class="state-icon" aria-hidden="true">!</div><h3>Приглашение недоступно</h3><p>Ссылка могла истечь или организатор отменил приглашение. Попросите отправить новую ссылку.</p><button class="text-button" data-action="organizer">Я организатор — войти</button>`;}
else if(s==='expired'){panel=`<div class="state-icon" aria-hidden="true">↻</div><h3>Войдите снова</h3><p>Сессия завершилась. Войдите через Telegram, чтобы продолжить работу с событиями.</p>${primary(isMini?'Продолжить через Telegram':'Войти снова через Telegram','renew')}<p class="note">Незавершённый черновик сохранён на этом устройстве.</p><button class="text-button" data-action="exit">Вернуться на экран входа</button>`;}
else if(s==='loading'){panel=`<div class="state-icon" aria-hidden="true"><span class="spinner"></span></div><h3>${isMini?'Входим через Telegram':'Проверяем вход'}</h3><p>${isMini?'Используем ваш аккаунт Telegram. Ничего вводить не нужно.':'Проверяем вашу сессию. Это обычно занимает несколько секунд.'}</p><div class="progress" role="status"><span class="spinner" aria-hidden="true"></span>Подключаемся…</div>${primary('Проверяем вход…','none',true)}`;}
else if(s==='waiting'){panel=`<h3>${isMini?'Подтверждаем вход':'Подтвердите вход в Telegram'}</h3><p>${isMini?'Проверяем данные вашего аккаунта.':'Завершите вход на странице Telegram. Затем вы вернётесь в Family Events.'}</p>${primary('Ожидаем подтверждение…','none',true)}<button class="text-button" data-action="cancel">Отменить вход</button>`;}
else if(s==='stale'){panel=`<div class="state-icon" aria-hidden="true">↻</div><h3>Откройте приложение заново</h3><p>Данные входа Telegram устарели. Перезапустите Mini App, чтобы безопасно войти снова.</p>${primary('Открыть заново в Telegram','reopen')}<p class="note">Простое обновление страницы может не помочь.</p>`;}
else if(['error','offline','timeout','blocked','cancelled'].includes(s)){const messages={error:['Не удалось войти','Сервис входа временно недоступен. Попробуйте ещё раз.'],offline:['Нет соединения','Проверьте интернет и повторите вход.'],timeout:['Ответ не получен','Вход занял больше времени, чем обычно. Попробуйте снова.'],blocked:['Окно входа не открылось','Браузер заблокировал новое окно. Продолжите вход в этой вкладке.'],cancelled:['Вход отменён','Вы не завершили вход в Telegram. Можно попробовать ещё раз.']};const [title,message]=messages[s];panel=`<h3>${title}</h3><div class="error" ${s==='cancelled'?'role="status"':'role="alert"'}><span aria-hidden="true">${s==='cancelled'?'↩':'!'}</span><p>${message}</p></div>${primary(s==='blocked'?'Продолжить в этой вкладке':'Попробовать снова',s==='blocked'?'redirect':'retry')}<button class="text-button" data-action="exit">Вернуться на экран входа</button>`;}
else{panel=`<h3>${isMini?'Войти в Family Events':'Вход для организатора'}</h3><p>${isMini?'В Telegram вход выполняется автоматически. Продолжите, если проверка не запустилась.':'Используйте аккаунт Telegram, чтобы создавать события и управлять приглашениями.'}</p>${primary(isMini?'Продолжить через Telegram':'Войти через Telegram','login')}<p class="note">${isMini?'Пароль и код в Family Events вводить не нужно.':'Подтверждение входа — на странице Telegram. Пароль здесь вводить не нужно.'}</p>`;}
if(!body){const single=isMini||s==='expired';const context=s==='expired'?'<div class="expired-context" aria-hidden="true"><div class="skeleton" style="width:50%"></div><div class="skeleton card"></div></div>':'';body=`${brand}${context}<div class="content">${hero}<section class="auth ${s==='expired'?'expiry':''}" aria-label="${s==='expired'?'Повторный вход':'Вход организатора'}" ${['loading','waiting'].includes(s)?'aria-busy="true"':''}>${panel}</section></div>${inviteFoot}`;stage.innerHTML=host+`<div class="product ${single?'single':''}">${body}</div>`;}else stage.innerHTML=host+`<div class="product">${body}</div>`;
document.getElementById('announcement').textContent=stage.querySelector('h3,h2')?.textContent||'';
}
function start(reopen=false){go(platform.value==='mini'?'loading':'waiting');const result=outcome.value;timer=setTimeout(()=>go(result==='success'?'events':result),1500);}
stage.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.action;if(['login','retry','redirect','reopen'].includes(a))start(a==='reopen');else if(a==='renew'){renewing=true;start();}else if(['exit','cancel'].includes(a)){renewing=false;go(a==='cancel'?'cancelled':'idle');}else if(a==='guest')go('guest');else if(a==='organizer')go('idle');else if(a==='rsvp'||a==='decline')document.getElementById('guest-status').textContent=a==='rsvp'?'Ответ «Я приду» показан в макете.':'Ответ «Не смогу прийти» показан в макете.';else if(a==='create-event')stage.querySelector('.demo-result').textContent='Следующий экран — создание события.';else if(a==='close-mini')go('idle');});state.addEventListener('change',()=>{clearTimeout(timer);renewing=state.value==='expired';render();});width.addEventListener('change',render);platform.addEventListener('change',()=>{renewing=false;go(platform.value==='mini'?'loading':'idle');if(platform.value==='mini'){timer=setTimeout(()=>go(outcome.value==='success'?'events':outcome.value),1500);}});render();})();
</script></body></html>
