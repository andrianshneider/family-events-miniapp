<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>02 — Мои события · Family Events</title><style>
:root{color-scheme:light;--bg:#fffdfb;--ink:#292433;--sub:#716879;--accent:#7952c7;--soft:#f5efff;--line:#e6dfe9;--surface:#fff}*{box-sizing:border-box}body{margin:0;background:#f2f0f6;color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,select,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}.review{max-width:1160px;padding:0 16px;margin:24px auto}.review>h1{font-size:22px;margin:0 0 6px}.review>p{color:var(--sub);margin:0 0 18px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}.controls label{display:grid;gap:4px;font-size:12px;color:var(--sub)}select{min-height:44px;padding:8px 32px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:14px;max-width:100%}.stage{width:390px;max-width:100%;margin:auto;background:var(--bg);border:1px solid var(--line);border-radius:26px;box-shadow:0 16px 50px #29243310;overflow:hidden;container-type:inline-size}.host{background:var(--soft);padding:8px 20px;display:flex;align-items:center;justify-content:space-between;font-size:12px;border-bottom:1px solid var(--line)}.host button{width:48px;height:48px;border:0;background:none;color:var(--ink);font-size:24px}.product{min-height:812px;display:flex;flex-direction:column}.header{display:flex;align-items:center;justify-content:space-between;padding:24px;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}.brand b{display:grid;place-items:center;width:38px;height:38px;background:var(--soft);color:var(--accent);border-radius:12px;font-size:24px}.avatar{flex:none;width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:#eae1f7;color:#63409f;font-weight:600}.main{padding:0 24px 32px;flex:1}.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 20px;flex-wrap:wrap}.title-row h2{font-size:28px;letter-spacing:-.6px;line-height:34px;margin:0}.primary,.secondary{min-height:52px;padding:12px 16px;border:0;border-radius:14px;background:var(--accent);color:#fff;display:flex;justify-content:center;align-items:center;gap:8px;font-size:15px;font-weight:500}.primary:disabled{background:#d8c9ef;color:#49385e}.secondary{background:var(--soft);color:#63409f;border:1px solid var(--line)}.create{width:100%}.section-head{display:flex;align-items:center;gap:8px;margin:24px 0 12px}.section-head h3{margin:0;font-size:18px;line-height:26px;font-weight:600}.count{font-size:12px;background:var(--soft);color:#63409f;border-radius:8px;padding:2px 7px}.grid{display:grid;gap:14px}.event-card{display:block;width:100%;border:1px solid var(--line);padding:0;border-radius:20px;background:var(--surface);overflow:hidden;color:var(--ink);text-align:left}.cover{height:112px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#eee5fa;font-size:42px}.cover>span{z-index:1}.cover.trip{background:#e2eff6}.cover.dinner{background:#f5e9d8}.cover.past{background:#edeaf0}.cover.fallback{background:var(--soft);font-size:32px;color:var(--accent)}.card-content{padding:16px 18px}.card-title{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.card-title h4{margin:0 0 8px;font-size:18px;line-height:25px;letter-spacing:-.2px;overflow-wrap:anywhere}.chevron{font-size:22px;color:var(--sub)}.meta{color:var(--sub);font-size:14px;line-height:21px;margin:3px 0;overflow-wrap:anywhere}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}.guests{font-size:13px;color:var(--ink)}.badge{padding:4px 9px;border-radius:8px;font-size:11px;line-height:17px;font-weight:500;background:#eaf4ee;color:#2c6043}.badge.draft{background:#f7eddb;color:#795723}.badge.ended{background:#efedf3;color:#61566d}.badge.cancelled{background:#fff0f3;color:#a32d45}.empty,.error-panel{padding:36px 20px;border:1px solid var(--line);border-radius:20px;background:var(--surface);text-align:center;margin-top:20px}.empty-icon{background:var(--soft);border-radius:18px;width:64px;height:64px;margin:0 auto 20px;display:grid;place-items:center;font-size:30px;color:var(--accent)}.empty h3,.error-panel h3{font-size:21px;line-height:28px;margin:0 0 10px}.empty p,.error-panel p{color:var(--sub);font-size:15px;line-height:23px;margin:0 0 24px}.empty .primary,.error-panel .primary{width:100%}.banner{padding:12px 14px;background:#fff0f3;border:1px solid #edc4ce;border-radius:12px;color:#a32d45;margin:0 0 16px;font-size:14px;line-height:21px}.banner.offline{background:#f7eddb;color:#795723;border-color:#e5d6b6}.banner button{margin-top:8px;width:100%;background:none;border:1px solid currentColor;border-radius:10px;min-height:48px;font-size:14px;color:inherit}.sk-card{border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:14px 0;background:var(--surface)}.sk-cover{height:112px;background:#eeeaf2}.sk-body{padding:18px;display:grid;gap:12px}.sk-line{height:15px;background:#eeeaf2;border-radius:6px;width:70%}.sk-line:first-child{height:22px;width:85%}.nav{display:flex;justify-content:space-around;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}.nav button{border:0;background:none;color:var(--sub);min-width:64px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px}.nav button[aria-current=page]{color:#63409f}.nav i{font-style:normal;font-size:20px}.back{min-height:48px;border:0;background:none;padding:0 8px;color:#63409f;font-size:14px}.detail h2{font-size:27px;line-height:34px;margin:18px 0}.detail .cover{border-radius:18px;margin:18px 0}.detail .secondary{width:100%;margin-top:20px}.detail p{color:var(--sub)}.detail dl{margin:20px 0}.detail dt{color:var(--sub);font-size:12px;margin-top:14px}.detail dd{margin:2px 0;color:var(--ink);font-size:16px}.detail label{display:block;margin-bottom:16px;font-size:14px;font-weight:500}.detail input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:12px;margin-top:6px;font-size:16px}.detail .primary{width:100%;margin-top:24px}.status{font-size:13px;color:var(--sub);margin-top:16px}.loading-label{color:var(--sub);font-size:13px;margin-bottom:12px}.spinner{width:16px;height:16px;display:inline-block;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:turn 1s linear infinite}.footnote{font-size:12px;line-height:18px;color:var(--sub);margin:20px 0 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@container(min-width:650px){.header{padding:32px 40px}.main{padding:0 40px 40px}.title-row{flex-wrap:nowrap}.create{width:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.empty,.error-panel{max-width:520px;margin:56px auto}.detail{max-width:520px;margin:auto}.nav{justify-content:center;gap:60px}.section-head{margin-top:28px}.product{min-height:768px}}@media(max-width:500px){.review{padding:0 8px}.controls{gap:8px}.controls label{width:calc(50% - 4px)}.stage{border-radius:20px}.review>h1{font-size:19px}}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#201c27;--surface:#292431;--ink:#f5f0fa;--sub:#c4b9ce;--line:#4b4254;--soft:#362749;--accent:#9e7ce1}body{background:#18151e}.primary{background:#7952c7}.avatar{background:#392951;color:#e3d5fa}.cover{background:#392951}.cover.trip{background:#233b49}.cover.dinner{background:#493b2a}.cover.past{background:#34303d}.nav button[aria-current=page],.secondary,.back{color:#e0d0fa}.sk-cover,.sk-line{background:#403847}}@media(prefers-reduced-motion:reduce){.spinner{animation:none;border-right-color:currentColor}}@keyframes turn{to{transform:rotate(360deg)}}
</style></head><body><div class="review"><h1>02 — Мои события</h1><p>Макет организатора. Данные демонстрационные; кнопки показывают переходы.</p><div class="controls"><label>Платформа<select id="platform"><option value="web">Web</option><option value="pwa">PWA</option><option value="mini">Telegram Mini App</option></select></label><label>Ширина<select id="width"><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option></select></label><label>Состояние<select id="state"><option value="ready">Предстоящие и прошедшие</option><option value="upcoming">Только предстоящие</option><option value="past">Только прошедшие</option><option value="empty">Нет событий</option><option value="loading">Первичная загрузка</option><option value="error">Ошибка загрузки</option><option value="refresh">Ошибка обновления</option><option value="offline">Offline · сохранённые события</option><option value="cancelled">Отменённое событие</option></select></label></div><div class="stage" id="stage"></div><div class="sr" id="announce" role="status" aria-live="polite"></div></div><script>
(()=>{const stage=document.getElementById('stage'),state=document.getElementById('state'),width=document.getElementById('width'),platform=document.getElementById('platform');let view='home',selected=null,timer;const records=[{id:'birthday',title:'День рождения Анны',date:'10 октября 2026',time:'18:00',place:'Ресторан «La Prima»',yes:8,status:'Опубликовано',kind:'published',art:'birthday',emoji:'🎂',period:'upcoming'},{id:'trip',title:'Поездка с семьёй',date:'24 октября 2026',time:'',place:'',yes:3,status:'Опубликовано',kind:'published',art:'trip',emoji:'✈️',period:'upcoming'},{id:'draft',title:'Семейный ужин',date:'',time:'',place:'',yes:0,status:'Черновик',kind:'draft',art:'fallback',emoji:'♡',period:'draft'},{id:'past',title:'Встреча в кругу близких',date:'20 сентября 2026',time:'15:00',place:'Загородный дом',yes:12,status:'Завершено',kind:'ended',art:'past',emoji:'🌿',period:'past'}];const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const primary=(label,action,disabled=false)=>`<button class="primary ${action==='create'?'create':''}" data-action="${action}" ${disabled?'disabled':''}>${disabled?'<span class="spinner" aria-hidden="true"></span>':''}${label}</button>`;const badge=e=>`<span class="badge ${e.kind}">${e.status}</span>`;const cover=e=>`<div class="cover ${e.art}" aria-hidden="true"><span>${e.emoji}</span></div>`;function card(e){return `<article><button class="event-card" data-id="${e.id}" aria-label="${state.value==='offline'?'Просмотреть сохранённое событие':e.kind==='draft'?'Редактировать черновик':'Управлять событием'}: ${esc(e.title)}. ${e.date||'Дата не выбрана'}. ${e.yes} подтвердили. ${e.status}">${cover(e)}<div class="card-content"><div class="card-title"><h4>${esc(e.title)}</h4><span class="chevron" aria-hidden="true">›</span></div>${e.date?`<div class="meta">${e.date}${e.time?' · '+e.time:''}</div>`:''}${e.place?`<div class="meta">${esc(e.place)}</div>`:''}<div class="card-foot"><span class="guests">${e.yes} подтвердили</span>${badge(e)}</div></div></button></article>`;}function section(title,items){return items.length?`<section aria-label="${title}"><div class="section-head"><h3>${title}</h3><span class="count" aria-label="${items.length} событий">${items.length}</span></div><div class="grid">${items.map(card).join('')}</div></section>`:'';}function render(){stage.style.width=width.value+'px';let content='',s=state.value;const host=platform.value==='mini'?'<div class="host"><span>Mini App · системная область Telegram</span><button data-action="close" aria-label="Закрыть Mini App">×</button></div>':'';const header='<header class="header"><div class="brand"><b aria-hidden="true">♡</b><span>Family Events</span></div><button class="avatar" data-action="profile" aria-label="Открыть профиль организатора">АШ</button></header>';
if(view==='manage'){content=`<iframe id="manage-event-frame" title="Управление событием" src="04-event-management.html?embed=1" style="width:100%;height:1650px;border:0;display:block"></iframe>`;}
else if(view==='create'){content=`<iframe id="create-event-frame" title="Создать событие" src="03-create-event.html?embed=1" style="width:100%;height:1800px;border:0;display:block"></iframe>`;}
else if(view==='profile'){content='<div class="detail"><button class="back" data-action="back">← Мои события</button><h2>Профиль организатора</h2><p>Переход к профилю Telegram. Этот экран проектируется отдельно.</p><button class="secondary" data-action="back">Вернуться к событиям</button></div>';}
else if(view!=='home'){content=`<div class="detail"><button class="back" data-action="back">← Мои события</button><h2>${view==='calendar'?'Календарь':'Вишлисты'}</h2><p>Следующий раздел приложения, вне этого макета.</p></div>`;}
else {content=`<div class="title-row"><h2>Мои события</h2>${primary(s==='loading'?'Загружаем события…':'+ Создать событие','create',s==='loading'||s==='offline')}</div>`;
if(s==='loading')content+='<div class="loading-label" role="status">Загружаем ваши события…</div><div aria-hidden="true">'+[1,2].map(()=>'<div class="sk-card"><div class="sk-cover"></div><div class="sk-body"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div></div>').join('')+'</div>';
else if(s==='error')content+=`<div class="error-panel" role="alert"><div class="empty-icon" aria-hidden="true">!</div><h3>Не удалось загрузить события</h3><p>Проверьте соединение и попробуйте ещё раз.</p>${primary('Попробовать снова','retry')}</div>`;
else if(s==='empty')content+=`<div class="empty"><div class="empty-icon" aria-hidden="true">♡</div><h3>Всё начинается со встречи</h3><p>Создайте первое событие и пригласите тех, с кем хочется разделить этот день.</p>${primary('Создать первое событие','create')}</div>`;
else {if(s==='refresh')content+='<div class="banner" role="alert">Не удалось обновить список. Показываем ранее загруженные события.<button data-action="retry">Повторить обновление</button></div>';if(s==='offline')content+='<div class="banner offline" role="status">Нет соединения. Показываем сохранённые события. Изменения временно недоступны.<button data-action="retry">Проверить соединение</button></div>';let upcoming=records.filter(e=>e.period==='upcoming'),drafts=records.filter(e=>e.period==='draft'),past=records.filter(e=>e.period==='past');if(s==='upcoming')past=[];if(s==='past'){upcoming=[];drafts=[];}if(s==='cancelled')upcoming=[{...records[0],status:'Отменено',kind:'cancelled'}];content+=section('Предстоящие',upcoming)+section('Черновики',drafts)+section('Прошедшие',past);if(s==='past')content+='<p class="footnote">Предстоящих событий пока нет. Запланируйте новую встречу с близкими.</p>';}}
const nav='<nav class="nav" aria-label="Основная навигация"><button data-action="back" aria-current="page"><i aria-hidden="true">▦</i>События</button><button data-action="calendar"><i aria-hidden="true">▤</i>Календарь</button><button data-action="wishlist"><i aria-hidden="true">♡</i>Вишлисты</button></nav>';stage.innerHTML=host+`<div class="product">${header}<main class="main" ${s==='loading'&&view==='home'?'aria-busy="true"':''}>${content}</main>${nav}</div>`;const managementFrame=document.getElementById('manage-event-frame');if(managementFrame)managementFrame.onload=()=>managementFrame.contentWindow.postMessage({source:'family-events-host',action:'init',event:selected,newEvent:!!selected?.newEvent},location.protocol==='file:'?'*':location.origin);document.getElementById('announce').textContent=view==='home'?'Мои события':stage.querySelector('.detail h2')?.textContent||'';}
window.addEventListener('message',e=>{if(e.source===document.getElementById('manage-event-frame')?.contentWindow&&e.data?.source==='family-events-manage'&&e.data.action==='back'){view='home';render();}});
window.addEventListener('message',e=>{if(e.source!==document.getElementById('create-event-frame')?.contentWindow||e.data?.source!=='family-events-create')return;if(e.data.action==='cancel'){view='home';render();}else if(e.data.action==='created'){const item=e.data.event;selected={...item,date:item.date,time:item.time,yes:0,status:'Опубликовано',kind:'published',art:'fallback',emoji:'♡',period:'upcoming',newEvent:true};records.unshift(selected);view='manage';render();;}});
stage.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.id){selected=records.find(r=>r.id===b.dataset.id);if(state.value==='cancelled'&&selected.id==='birthday')selected={...selected,status:'Отменено',kind:'cancelled'};view='manage';render();return;}const a=b.dataset.action;if(a==='create'||a==='profile'||a==='calendar'||a==='wishlist'){view=a;render();}else if(a==='back'||a==='close'){view='home';render();}else if(a==='retry'){clearTimeout(timer);state.value='loading';render();timer=setTimeout(()=>{state.value='ready';render();},1000);}});
stage.addEventListener('submit',e=>{if(e.target.id!=='create-form')return;e.preventDefault();const input=document.getElementById('event-name');const title=input.value.trim();if(!title){input.setCustomValidity('Введите название события');input.reportValidity();return;}if(!e.target.reportValidity())return;const button=e.target.querySelector('.primary');button.disabled=true;button.innerHTML='<span class="spinner" aria-hidden="true"></span>Сохраняем…';document.getElementById('create-status').textContent='Создаём черновик…';timer=setTimeout(()=>{records.unshift({id:'demo-'+Date.now(),title,date:'',time:'',place:'',yes:0,status:'Черновик',kind:'draft',art:'fallback',emoji:'♡',period:'draft'});view='home';state.value='ready';render();document.getElementById('announce').textContent='Черновик создан в макете. Он не сохраняется после перезагрузки.';},800);});stage.addEventListener('input',e=>{if(e.target.id==='event-name')e.target.setCustomValidity('');});state.addEventListener('change',()=>{clearTimeout(timer);view='home';render();});width.addEventListener('change',render);platform.addEventListener('change',render);render();})();
</script></body></html>
