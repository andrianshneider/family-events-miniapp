</dd><dt>Описание</dt><dd>${event.description}</dd><dt>Dress code</dt><dd>${event.dress}</dd></dl>`}</section><div class="public-side"><section class="panel" aria-labelledby="rsvp-title"><h2 id="rsvp-title">${s==='past'?'Встреча завершилась':'Вы придёте?'}</h2>${answer?`<div class="status-answer">Ваш ответ: <strong>${labels[answer.status]}</strong></div>${answer.status!=='no'?`<p class="hint">${answer.adults} взрослых · ${answer.children} детей</p>`:''}${button('Изменить','change','secondary block-action',readonly)}`:`<p class="empty-copy">Дайте знать, чтобы организатору было проще подготовиться.</p><div class="rsvp-buttons">${Object.entries(labels).map(([key,label])=>button(label,key,key==='yes'?'primary':'secondary',readonly)).join('')}</div>`}<p class="hint">Регистрация не нужна. Ваш ответ сохраняется для этого устройства.</p>${answer?button('Получать напоминания в Telegram','notifications','secondary block-action'): ""}${s==='past'?'<p class="hint">Новые ответы и изменения больше не принимаются.</p>':''}</section>${noWishlist?'':`<section class="panel" aria-labelledby="wishlist-title"><h2 id="wishlist-title">Что подарить</h2>${s==='wishlist-loading'?'<p role="status">Загружаем wishlist…</p><div class="skeleton" aria-hidden="true"></div>':s==='wishlist-error'?'<p class="error" role="alert">Не удалось загрузить подарки. Ответ на приглашение доступен.</p>'+button('Повторить','wishlist-retry'):giftList()+button('Посмотреть wishlist','wishlist','secondary block-action')}</section>`}</div></div>`}$('#stage').style.width=$('#width').value+'px';$('#stage').innerHTML=host+'<header class="public-header"><div class="brand"><span aria-hidden="true">♡</span>Family Events</div></header>'+`<main class="content" ${s==='loading'?'aria-busy="true"':''}>${content}</main><footer class="public-footer">Личная встреча по приглашению</footer>`;}function collect(){const f=$('#rsvp-form');if(!f)return;draft.name=f.elements.name.value;draft.comment=f.elements.comment.value;draft.adults=Number(f.elements.adults?.value||1);draft.children=Number(f.elements.children?.value||0)}function openRsvp(status){returnFocus=document.activeElement;draft=answer?{...answer,status:status||answer.status}:{...draft,status:status||'yes'};modal.innerHTML=`<h2 id="modal-title">${answer?'Изменить ответ':'Ответить на приглашение'}</h2><form class="rsvp-form" id="rsvp-form" novalidate><label for="guest-name">Ваше имя *</label><input id="guest-name" name="name" required minlength="2" maxlength="60" autocomplete="name" value="${esc(draft.name)}" aria-describedby="name-error"><p class="error" id="name-error" hidden></p><label for="response-status">Ваш ответ</label><select name="status" id="response-status">${Object.entries(labels).map(([key,label])=>`<option value="${key}" ${draft.status===key?'selected':''}>${label}</option>`).join('')}</select><div class="pair" id="people" ${draft.status==='no'?'hidden':''}><label for="adults">Взрослых<input id="adults" name="adults" type="number" min="1" max="20" value="${draft.adults}"></label><label for="children">Детей<input id="children" name="children" type="number" min="0" max="20" value="${draft.children}"></label></div><label for="comment">Комментарий <span class="optional">Необязательно</span><textarea id="comment" name="comment" maxlength="300" placeholder="Например, будем немного позже">${esc(draft.comment)}</textarea></label><p class="hint">До 300 символов</p><p id="rsvp-error" class="error" role="alert" hidden></p><button class="primary" id="confirm" type="submit">${answer?'Сохранить изменения':'Подтвердить'}</button><button type="button" class="secondary" data-action="cancel">Отмена</button><p class="hint">Демонстрационный ответ виден только в этом браузере.</p></form>`;if(!modal.open)modal.showModal();$('#guest-name').focus();$('#response-status').onchange=e=>{draft.status=e.target.value;$('#people').hidden=draft.status==='no'};$('#rsvp-form').onsubmit=e=>{e.preventDefault();if(busy)return;collect();const invalid=draft.name.trim().length<2;$('#name-error').hidden=!invalid;$('#name-error').textContent='Введите имя от 2 до 60 символов.';$('#guest-name').setAttribute('aria-invalid',String(invalid));if(invalid){$('#guest-name').focus();return}if(draft.status!=='no'&&(!Number.isInteger(draft.adults)||draft.adults<1||draft.adults>20||!Number.isInteger(draft.children)||draft.children<0||draft.children>20)){showError('Укажите от 1 до 20 взрослых и от 0 до 20 детей.');return}busy=true;modal.setAttribute('aria-busy','true');modal.querySelectorAll('input,textarea,select,button').forEach(el=>el.disabled=true);$('#confirm').innerHTML='<span class="spinner" aria-hidden="true"></span>Сохраняем…';timer=setTimeout(()=>{busy=false;modal.removeAttribute('aria-busy');modal.querySelectorAll('input,textarea,select,button').forEach(el=>el.disabled=false);$('#confirm').textContent=answer?'Сохранить изменения':'Подтвердить';if(state.value==='rsvp-error'||!navigator.onLine){showError('Не удалось сохранить ответ. Проверьте соединение и попробуйте снова. Введённые данные сохранены.');return}const result={...draft,name:draft.name.trim()};try{localStorage.setItem('fe-public-rsvp-demo',JSON.stringify(result))}catch{showError('Не удалось сохранить ответ в этом браузере. Проверьте доступное место и попробуйте снова.');return}answer=result;modal.close();render();showSuccess();$('#announce').textContent='Спасибо! Ваш ответ сохранён в макете.'},750)}}function showSuccess(){modal.innerHTML='<h2 id="modal-title">Спасибо! Ваш ответ сохранён</h2>'+ (answer?.status==='yes'?'<p>Увидимся '+event.date+'.</p>':'')+button('Напомнить мне в Telegram','notifications','primary')+(state.value!=='no-wishlist'&&state.value!=='minimal'?button('Посмотреть wishlist','wishlist'):'')+button('К событию','success-close');if(!modal.open)modal.showModal()}function showError(text){$('#rsvp-error').hidden=false;$('#rsvp-error').textContent=text}document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(labels[a])openRsvp(a);if(a==='change')openRsvp();if(a==='notifications')location.href='20-telegram-notifications.html';if(a==='success-close')modal.close();if(a==='cancel'&&!busy){collect();modal.close()}if(a==='wishlist'){location.href='17-guest-wishlist.html';return}if(a==='back'){view='event';render();$('#stage h1')?.setAttribute('tabindex','-1');$('#stage h1')?.focus()}if(a==='retry'||a==='wishlist-retry'){state.value='loading';render();timer=setTimeout(()=>{state.value='ready';render()},650)}});modal.addEventListener('cancel',e=>{if(busy)e.preventDefault();else collect()});modal.addEventListener('close',()=>returnFocus?.focus());state.onchange=()=>{clearTimeout(timer);busy=false;modal.removeAttribute('aria-busy');if(modal.open)modal.close();view='event';answer=null;if(labels[state.value])answer={name:'Анна',status:state.value,adults:2,children:1,comment:''};render();if(['rsvp','saving','rsvp-error'].includes(state.value)){openRsvp('yes');if(state.value==='rsvp-error')showError('Не удалось сохранить ответ. Попробуйте снова. Данные не потеряны.');if(state.value==='saving'){busy=true;modal.setAttribute('aria-busy','true');modal.querySelectorAll('input,textarea,select,button').forEach(el=>el.disabled=true);$('#confirm').innerHTML='<span class="spinner" aria-hidden="true"></span>Сохраняем…'}}};$('#width').onchange=render;$('#platform').onchange=render;render();const screen=new URLSearchParams(location.search).get('screen');if(screen==='09')openRsvp('yes');if(screen==='11'){answer=answer||{name:'Анна',status:'yes',adults:2,children:1,comment:'Будем чуть позже'};render();openRsvp()}if(screen==='10'){answer=answer||{name:'Анна',status:'yes',adults:2,children:1,comment:''};render();showSuccess()}})();
</script></body></html>
