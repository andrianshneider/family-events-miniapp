</style></head><body><div class="review"><h1 class="review-title">12 — Список гостей</h1><p class="review-title">Макет организатора · демонстрационные ответы</p><div class="controls"><label>Платформа<select id="platform"><option value="web">Web</option><option value="pwa">PWA</option><option value="mini">Telegram Mini App</option></select></label><label>Ширина<select id="width"><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1280</option></select></label><label>Состояние<select id="state"><option value="ready">Есть ответы</option><option value="empty">Никто не ответил</option><option value="empty-filter">Пустой фильтр</option><option value="loading">Первичная загрузка</option><option value="error">Ошибка загрузки</option><option value="refresh">Ошибка обновления</option><option value="offline">Нет соединения</option><option value="expired">Сессия истекла</option><option value="forbidden">Нет доступа</option><option value="unavailable">Событие недоступно</option></select></label></div><div class="stage" id="stage"></div></div><div class="sr" id="announce" role="status" aria-live="polite"></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),state=$('#state'),statuses={yes:'Будут',maybe:'Пока не знают',no:'Не будут'},filters=[['all','Все'],['yes','Будут'],['maybe','Думают'],['no','Не будут']];let filter='all',timer;const guests=[{name:'Анна Морозова',status:'yes',adults:2,children:1,comment:'Приедем чуть раньше. У ребёнка аллергия на орехи.'},{name:'Дмитрий Соколов',status:'maybe',adults:1,children:0,comment:'Смогу подтвердить ближе к выходным.'},{name:'Елена Кузнецова',status:'no',comment:'Спасибо за приглашение! В этот день будем в поездке.'},{name:'Максим и Ольга',status:'yes',adults:2,children:2,comment:''},{name:'Светлана Волкова',status:'yes',adults:1,children:0,comment:'Буду после 19:00.'},{name:'Алексей Петров',status:'maybe',adults:2,children:0,comment:''}];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const button=(text,action,kind='secondary',disabled=false)=>`<button type="button" class="${kind}" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`;function records(){return state.value==='empty'?[]:state.value==='empty-filter'?guests.filter(g=>g.status!=='no'):guests}function render(){const s=state.value,list=records(),counts=Object.fromEntries(['yes','maybe','no'].map(k=>[k,list.filter(g=>g.status===k).length]));const people=list.filter(g=>g.status==='yes').reduce((sum,g)=>[sum[0]+g.adults,sum[1]+g.children],[0,0]);const host=$('#platform').value==='mini'?'<div class="host">Telegram · системная область Mini App</div>':'';let content='';const restricted=['expired','forbidden','unavailable'].includes(s);if(restricted){const texts={expired:['Войдите снова','Сессия истекла. После входа вы вернётесь к списку гостей.'],forbidden:['Список гостей доступен организатору','У вас нет доступа к ответам этого события.'],unavailable:['Событие недоступно','Возможно, оно удалено. Ответы гостей недоступны.']};content=`<section class="empty-list" role="${s==='expired'?'alert':'status'}"><h1 class="heading">${texts[s][0]}</h1><p>${texts[s][1]}</p>${s==='expired'?button('Войти через Telegram','retry','primary'):button('Мои события','events','primary')}</section>`}else{content=button('← К событию','back','back')+'<h1 class="heading">Список гостей</h1><p class="intro">День рождения Анны · 18 октября</p><p class="privacy-note">Ответы и комментарии видны только организатору.</p>';if(s==='loading')content+='<p role="status">Загружаем ответы гостей…</p><div aria-hidden="true"><div class="skstats"><div class="skeleton" style="height:90px"></div><div class="skeleton" style="height:90px"></div><div class="skeleton" style="height:90px"></div></div><div class="skeleton" style="height:180px"></div><div class="skeleton" style="height:180px"></div></div>';else if(s==='error')content+='<section class="empty-list" role="alert"><h2>Не удалось загрузить гостей</h2><p>Проверьте соединение и попробуйте снова.</p>'+button('Попробовать снова','retry','primary')+'</section>';else{if(s==='refresh'||s==='offline')content+=`<div class="banner" role="status">${s==='offline'?'Нет соединения. Показываем сохранённые ответы. Список может быть неактуален.':'Не удалось обновить список. Ранее загруженные ответы сохранены.'}${button(s==='offline'?'Проверить соединение':'Повторить обновление','retry')}</div>`;content+=`<section class="summary-wrap" aria-label="Сводка ответов"><div class="stats">${['yes','no','maybe'].map(k=>`<div class="stat"><b>${counts[k]}</b><span>${statuses[k]}</span></div>`).join('')}</div><p class="totals">Подтвердили: ${people[0]} взрослых · ${people[1]} детей</p><p class="hint">Сверху — число ответов. Взрослые и дети суммируются только для статуса «Будут».</p></section><div class="filters" role="group" aria-label="Фильтр по статусу ответа">${filters.map(([key,label])=>`<button type="button" data-filter="${key}" aria-pressed="${filter===key}" aria-controls="guest-results">${label}<small>${key==='all'?list.length:counts[key]}</small></button>`).join('')}</div>`;const shown=list.filter(g=>filter==='all'||g.status===filter);content+=`<section id="guest-results" aria-label="Ответы гостей"><p class="filter-caption">${filter==='all'?'Все ответы':filters.find(f=>f[0]===filter)[1]} · ${shown.length}</p>${!list.length?`<div class="empty-list"><h2>Пока никто не ответил на приглашение</h2><p>Пригласите близких. Их ответы появятся здесь.</p>${button('К приглашению гостей','back','primary')}</div>`:!shown.length?`<div class="empty-list"><h2>В этом фильтре пока нет ответов</h2><p>Выберите другой статус или посмотрите все ответы.</p>${button('Показать всех','reset-filter','primary')}</div>`:`<div class="guest-grid">${shown.map(g=>`<article class="guest-card"><div class="guest-top"><span class="initial" aria-hidden="true">${esc(g.name.split(' ').slice(0,2).map(n=>n[0]).join(''))}</span><h2>${esc(g.name)}</h2></div><span class="guest-status ${g.status}">${statuses[g.status]}</span>${g.status!=='no'?`<p class="people">Взрослых: ${g.adults} · Детей: ${g.children}</p>`:''}${g.comment?`<p class="comment"><span class="comment-label">Комментарий</span>${esc(g.comment)}</p>`:''}</article>`).join('')}</div>`}</section>`}}$('#stage').style.width=$('#width').value+'px';$('#stage').innerHTML=host+'<header class="header"><div class="brand"><span aria-hidden="true">♡</span>Family Events</div></header>'+`<main class="content" ${s==='loading'?'aria-busy="true"':''}>${content}</main>`;}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.filter){filter=b.dataset.filter;render();$('#stage [data-filter="'+filter+'"]').focus();$('#announce').textContent='Фильтр '+filters.find(f=>f[0]===filter)[1]+'. '+$('#guest-results .filter-caption').textContent;return}const a=b.dataset.action;if(a==='reset-filter'){filter='all';render();$('#stage [data-filter=all]').focus()}if(a==='back')location.href='04-event-management.html';if(a==='events')location.href='02-my-events.html';if(a==='retry'){state.value='loading';render();timer=setTimeout(()=>{state.value='ready';render();$('#announce').textContent='Список гостей загружен в макете'},700)}});state.onchange=()=>{clearTimeout(timer);filter=state.value==='empty-filter'?'no':'all';render()};$('#width').onchange=render;$('#platform').onchange=render;render()})();
</script></body></html>
