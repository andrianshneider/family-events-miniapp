(()=>{'use strict';const $=s=>document.querySelector(s),state=$('#state'),modal=$('#modal');let timer,busy=false,surprise=true,returnFocus,editing=null;const demo=[{id:'headphones',title:'Беспроводные наушники',price:'12990',currency:'RUB',comment:'Светлый цвет',link:'https://example.com/headphones',status:'free',art:'🎧',photo:''},{id:'book',title:'Книга о путешествиях',price:'2400',currency:'RUB',comment:'',link:'',status:'reserved',art:'📚',photo:'',person:'Анна Морозова'},{id:'coffee',title:'Набор для кофе',price:'',link:'',status:'free',art:'☕',photo:''}];let gifts=structuredClone(demo);try{const saved=JSON.parse(localStorage.getItem('fe-wishlist-management-demo')||'null');if(saved){gifts=saved.gifts;surprise=saved.surprise}}catch{}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(text,action,kind='secondary',disabled=false)=>`<button type="button" class="${kind}" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`;const readonly=()=>['offline','expired','loading'].includes(state.value);function persist(){try{localStorage.setItem('fe-wishlist-management-demo',JSON.stringify({gifts,surprise}));return true}catch{return false}}function render(){const s=state.value;let content=btn('← К событию','back','back')+'<h1 class="heading">Управление wishlist</h1><p class="intro">День рождения Анны</p>';if(s==='loading')content+='<p role="status">Загружаем подарки…</p><div class="gift-grid" aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div></div>';else if(s==='error'||s==='expired'){content+=`<div class="empty-wishlist" role="alert"><h2>${s==='expired'?'Войдите снова':'Не удалось загрузить wishlist'}</h2><p>${s==='expired'?'Сессия истекла. После входа вы вернётесь к подаркам.':'Проверьте соединение и попробуйте снова.'}</p>${btn(s==='expired'?'Войти через Telegram':'Попробовать снова','retry','primary')}</div>`}else{if(s==='offline')content+='<div class="banner icle>`).join('')}</div>`:`<div class="empty-wishlist"><h2>Wishlist пока пуст</h2><p>Добавьте идеи подарков, чтобы гостям было проще выбрать.</p>${btn('Добавить подарок','add','primary',readonly())}</div>`}`}$('#stage').style.width=$('#width').value+'px';$('#stage').innerHTML=($('#platform').value==='mini'?'<div class="host">Telegram · системная область Mini App</div>':'')+'<header class="header"><div class="brand"><span aria-hidden="true">♡</span>Family Events</div></header>'+`<main class="content" ${s==='loading'?'aria-busy="true"':''}>${content}</main>`;if($('#surprise-toggle'))$('#surprise-toggle').onchange=e=>{const old=surprise;surprise=e.target.checked;e.target.disabled=true;$('#toggle-feedback').textContent='Сохраняем режим…';timer=setTimeout(()=>{if(s==='toggle-error'||!persist()){surprise=old;render();$('#toggle-feedback').textContent='Не удалось изменить режим. Прежняя настройка сохранена. Попробуйте снова.'}else{render();$('#surprise-toggle').focus();$('#toggle-feedback').textContent='Настройка сохранена в макете'}},650)}}function open(title,body){returnFocus=document.activeElement;modal.innerHTML='<h2 id="modal-title">'+title+'</h2>'+body;if(!modal.open)modal.showModal();modal.querySelector('input,button')?.focus()}function editor(g){editing=g?.id||null;const value=g||{title:'',price:'',link:'',photo:''};open(g?'Редактировать подарок':'Добавить подарок',`<form class="editor" id="gift-form" novalidate><label for="gift-title">Название *</label><input id="gift-title" name="title" required minlength="2" maxlength="120" value="${esc(value.title)}" aria-describedby="gift-error"><label for="gift-price">Цена, ₽ <span class="optional">Необязательно</span></label><input id="gift-price" name="price" type="number" min="0.01" step="0.01" value="${esc(value.price)}"><label for="gift-currency">Валюта при цене</label><select id="gift-currency" name="currency"><option value="">Выберите валюту</option>${['RUB','EUR','USD'].map(c=>`<option ${value.currency===c?'selected':''}>${c}</option>`).join('')}</select><label for="gift-comment">Комментарий <span class="optional">Необязательно</span></label><textarea id="gift-comment" name="comment" maxlength="300">${esc(value.comment||'')}</textarea><p class="hint">До 300 символов</p><label for="gift-link">Ссылка <span class="optional">Необязательно</span></label><input id="gift-link" name="link" type="url" placeholder="https://…" value="${esc(value.link)}"><label for="gift-photo">Фото <span class="optional">Необязательно</span></label><input id="gift-photo" type="file" accept="image/jpeg,image/png,image/webp"><p class="hint">JPG / PNG / WebP, до 5 МБ. При замене старое фото сохраняется до успешной загрузки.</p><p class="error" id="gift-error" role="alert" hidden></p><button type="submit" class="primary" id="gift-save">${g?'Сохранить изменения':'Добавить подарок'}</button>${btn('Отмена','cancel')}</form>`);$('#gift-form').onsubmit=async e=>{e.preventDefault();if(busy)return;const f=e.target,title=f.elements.title.value.trim(),price=f.elements.price.value,link=f.elements.link.value.trim();$('#gift-title').setAttribute('aria-invalid','false');if(title.length<2||title.length>120){$('#gift-title').setAttribute('aria-invalid','true');showError('Введите название от 2 до 120 символов.');$('#gift-title').focus();return}if(price&&(!Number.isFinite(Number(price))||Number(price)<=0)){showError('Укажите положительную цену.');$('#gift-price').focus();return}const currency=f.elements.currency.value,comment=f.elements.comment.value;if(price&&!['RUB','EUR','USD'].includes(currency)){showError('Выберите валюту для указанной цены.');$('#gift-currency').focus();return}if(comment.length>300){showError('Комментарий — до 300 символов.');return}if(link){try{if(!['https:','http:'].includes(new URL(link).protocol))throw 0}catch{showError('Укажите ссылку, начинающуюся с https:// или http://.');$('#gift-link').focus();return}}let photo=value.photo||'';const file=$('#gift-photo').files[0];if(file&&(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)){showError('Выберите JPG, PNG или WebP до 5 МБ.');return}lock(true);try{if(file){photo=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});await new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=reject;im.src=photo})}}catch{lock(false);showError('Не удалось открыть фото. Выберите другое изображение.');return}timer=setTimeout(()=>{lock(false);if(state.value==='save-error'){showError('Не удалось сохранить подарок. Данные не потеряны. Попробуйте снова.');return}const old=gifts;const gift={...value,id:editing||crypto.randomUUID(),title,price,currency,comment,link,photo,status:value.status||'free',art:value.art||'🎁'};gifts=editing?gifts.map(x=>x.id===editing?gift:x):[...gifts,gift];if(!persist()){gifts=old;showError('Не удалось сохранить в браузере. Уменьшите фото или проверьте свободное место.');return}modal.close();render();$('#announce').textContent=editing?'Подарок обновлён':'Подарок добавлен'},750)}}function showError(text){$('#gift-error').hidden=false;$('#gift-error').textContent=text}function lock(v){busy=v;modal.setAttribute('aria-busy',String(v));modal.querySelectorAll('input,textarea,select,button').forEach(x=>x.disabled=v);$('#gift-save').innerHTML=v?'<span class="spinner" aria-hidden="true"></span>Сохраняем…':editing?'Сохранить изменения':'Добавить подарок'}function deletion(g,error=false){open('Удалить подарок?',`<p>Удалить «${esc(g.title)}» из wishlist?</p><p class="modal-copy">${g.status==='reserved'?'Этот подарок уже выбрал один из гостей. Всё равно удалить его? Его бронь также будет удалена. ':''}Это действие нельзя отменить.</p>${error?'<p class="error" role="alert">Не удалось удалить подарок. Он остаётся в wishlist. Попробуйте снова.</p>':''}${btn('Отмена','cancel')}<button type="button" class="danger" id="confirm-delete">Удалить подарок</button>`);$('#confirm-delete').onclick=()=>{busy=true;modal.querySelectorAll('button').forEach(x=>x.disabled=true);$('#confirm-delete').innerHTML='<span class="spinner" aria-hidden="true"></span>Удаляем…';timer=setTimeout(()=>{busy=false;if(state.value==='delete-error'){deletion(g,true);return}const old=gifts;gifts=gifts.filter(x=>x.id!==g.id);if(!persist()){gifts=old;deletion(g,true);return}modal.close();render();$('#announce').textContent='Подарок удалён'},700)}}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.edit)editor(gifts.find(g=>g.id===b.dataset.edit));if(b.dataset.delete)deletion(gifts.find(g=>g.id===b.dataset.delete));const a=b.dataset.action;if(a==='add')editor();if(a==='cancel'&&!busy)modal.close();if(a==='back')location.href='04-event-management.html';if(a==='retry'){state.value='loading';render();timer=setTimeout(()=>{state.value='ready';render()},650)}});modal.addEventListener('cancel',e=>{if(busy)e.preventDefault()});modal.addEventListener('close',()=>returnFocus?.focus());state.onchange=()=>{clearTimeout(timer);busy=false;if(modal.open)modal.close();gifts=state.value==='empty'?[]:structuredClone(demo);surprise=state.value!=='visible';render();if(['add','edit','saving','save-error'].includes(state.value)){editor(state.value==='edit'?gifts[0]:null);if(state.value==='saving')lock(true);if(state.value==='save-error')showError('Не удалось сохранить подарок. Введённые данные сохранены.')}if(['delete','delete-error'].includes(state.value))deletion(gifts[1],state.value==='delete-error')};$('#width').onchange=render;$('#platform').onchange=render;render();const screen=new URLSearchParams(location.search).get('screen');if(screen==='14')editor();if(screen==='15')editor(gifts[0]);if(screen==='16')deletion(gifts[1]);})();
</script></body></html>
