y')}</div>`;else{if(s==='offline')content+='<div class="banner" role="status">Нет соединения. Выбор и отмена временно недоступны.</div>';content+=`<div class="detail-layout"><div class="gift-photo" aria-hidden="true">${gift.art}</div><section class="detail-info"><h1 class="heading">${gift.title}</h1>${s==='minimal'?'':(gift.price?`<p class="price">${gift.price}</p>`:'')+(gift.comment?`<p class="gift-description">${gift.comment}</p>`:'')+(gift.link?`<a class="gift-link" href="${gift.link}" target="_blank" rel="noopener noreferrer" aria-label="Посмотреть подарок на внешнем сайте. Откроется новая вкладка">Посмотреть подарок ↗</a>`:'')}${success?`<div class="success-panel" role="status"><h2>${success==='reserved'?'Вы выбрали этот подарок':'Выбор отменён'}</h2><p>${success==='reserved'?'Теперь подарок закреплён за вами.':'Подарок снова доступен другим гостям.'}</p></div>`:''}${status==='own'?'<p class="own-status">Вы выбрали этот подарок</p>'+btn('Отменить выбор','cancel','secondary',busy||s==='offline'):status==='other'?btn('Уже выбран','none','primary',true):btn(busy?'<span class="spinner" aria-hidden="true"></span>Выбираем…':'Выбрать этот подарок','choose','primary',busy||s==='offline')}<p class="hint">Бронь не оплачивает подарок. Покупка происходит отдельно. Имена других гостей скрыты.</p></section></div>`}$('#stage').style.width=$('#width').value+'px';$('#stage').innerHTML=($('#platform').value==='mini'?'<div class="host">Telegram · системная область Mini App</div>':'')+'<header class="header"><div class="brand"><span aria-hidden="true">♡</span>Family Events</div></header>'+`<main class="content" ${busy||s==='loading'?'aria-busy="true"':''}>${content}</main>`}function open(title,body){modal.innerHTML='<h2 id="modal-title">'+title+'</h2>'+body;if(!modal.open)modal.showModal();modal.querySelector('input,button')?.focus()}function nameForm(){open('Как вас зовут?',`<p>Имя нужно организатору для вашего выбора. Регистрация не требуется.</p><form id="name-form" class="person-form" novalidate><label for="guest-name">Ваше имя *</label><input id="guest-name" name="name" minlength="2" maxlength="60" autocomplete="name" value="${esc(guestName)}" aria-describedby="name-error"><p class="error" id="name-error" role="alert" hidden></p><button type="submit" class="primary">Выбрать подарок</button>${btn('Отмена','close')}</form>`);$('#name-form').onsubmit=e=>{e.preventDefault();const name=$('#guest-name').value.trim();if(name.length<2||name.length>60){$('#name-error').hidden=false;$('#name-error').textContent='Введите имя от 2 до 60 символов.';$('#guest-name').setAttribute('aria-invalid','true');$('#guest-name').focus();return}guestName=name;modal.close();reserve()}}function persist(){try{let list=JSON.parse(localStorage.getItem('fe-guest-wishlist-demo')||'[]');const i=list.findIndex(g=>g.id===gift.id);if(i>=0)list[i].status=status;else list.push({...gift,status});localStorage.setItem('fe-guest-wishlist-demo',JSON.stringify(list));localStorage.setItem('fe-gift-guest-name-demo',guestName);return true}catch{return false}}function reserve(){if(busy||status!=='free')return;if(!guestName){nameForm();return}busy=true;render();timer=setTimeout(()=>{busy=false;if(state.value==='race'){status='other';render();open('Подарок уже выбран','<p>Этот подарок только что выбрал другой гость.</p>'+btn('Выбрать другой','back','primary'));return}if(state.value==='reserve-error'||!navigator.onLine){render();open('Не удалось выбрать подарок','<p>Проверьте соединение и попробуйте снова. Введённое имя сохранено.</p>'+btn('Повторить','choose','primary')+btn('Отмена','close'));return}status='own';if(!persist()){status='free';render();open('Выбор не сохранён','<p>Не удалось сохранить выбор на устройстве. Попробуйте снова.</p>'+btn('Закрыть','close'));return}success='reserved';render();$('#announce').textContent='Вы выбрали этот подарок'},800)}function cancellation(error=false){open('Отменить выбор?',`<p>Подарок снова станет свободным для остальных гостей.</p>${error?'<p class="error" role="alert">Не удалось отменить выбор. Подарок остаётся за вами.</p>':''}${btn('Оставить выбор','close','primary')}${btn('Отменить выбор','confirm-cancel')}`)}function cancel(){busy=true;modal.setAttribute('aria-busy','true');modal.querySelectorAll('button').forEach(b=>b.disabled=true);modal.querySelector('[data-action=confirm-cancel]').innerHTML='<span class="spinner" aria-hidden="true"></span>Отменяем…';timer=setTimeout(()=>{busy=false;modal.removeAttribute('aria-busy');if(state.value==='cancel-error'||!navigator.onLine){cancellation(true);return}status='free';if(!persist()){status='own';cancellation(true);return}modal.close();success='cancelled';render();$('#announce').textContent='Выбор отменён'},750)}document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||busy)return;const a=b.dataset.action;if(a==='back')location.href='17-guest-wishlist.html';if(a==='choose'){if(modal.open)modal.close();if(!hasRsvp&&!guestName)nameForm();else reserve()}if(a==='cancel')cancellation();if(a==='confirm-cancel')cancel();if(a==='close')modal.close();if(a==='retry'){state.value='free';render()}});modal.addEventListener('cancel',e=>{if(busy)e.preventDefault()});state.onchange=()=>{clearTimeout(timer);busy=false;modal.removeAttribute('aria-busy');if(modal.open)modal.close();success='';hasRsvp=!['no-rsvp','name'].includes(state.value);guestName=hasRsvp?'Анна':'';status=['own','cancel','cancelling','cancel-error'].includes(state.value)?'own':state.value==='other'||state.value==='race'?'other':'free';if(state.value==='reserved'){status='own';success='reserved'}if(state.value==='cancelled')success='cancelled';render();if(state.value==='name')nameForm();if(state.value==='reserving'){busy=true;render()}if(state.value==='reserve-error')open('Не удалось выбрать подарок','<p>Проверьте соединение и попробуйте снова. Данные не потеряны.</p>'+btn('Повторить','choose','primary')+btn('Отмена','close'));if(state.value==='race')open('Подарок уже выбран','<p>Этот подарок только что выбрал другой гость.</p>'+btn('Выбрать другой','back','primary'));if(['cancel','cancelling','cancel-error'].includes(state.value)){cancellation(state.value==='cancel-error');if(state.value==='cancelling'){busy=true;modal.setAttribute('aria-busy','true');modal.querySelectorAll('button').forEach(b=>b.disabled=true);modal.querySelector('[data-action=confirm-cancel]').innerHTML='<span class="spinner" aria-hidden="true"></span>Отменяем…'}}};$('#width').onchange=render;$('#platform').onchange=render;render()})();
</script></body></html>
