</style></head><body><div class="review"><h1 class="review-title">07 — Диалог удаления события</h1><p class="review-title">Макет организатора · ответы и действия демонстрационные</p><div class="controls"><label>Платформа<select id="platform"><option value="web">Web</option><option value="pwa">PWA</option><option value="mini">Telegram Mini App</option></select></label><label>Ширина<select id="width"><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1280</option></select></label><label>Состояние<select id="state"><option value="ready">Есть гости и подарки</option><option value="new">Событие создано</option><option value="empty">Нет ответов и подарков</option><option value="minimal">Только обязательные поля</option><option value="past">Прошедшее событие</option><option value="loading">Загрузка</option><option value="error">Ошибка загрузки</option><option value="refresh">Ошибка обновления</option><option value="offline">Нет соединения</option><option value="expired">Сессия истекла</option><option value="guests-error">Ошибка блока гостей</option><option value="wishlist-error">Ошибка блока wishlist</option><option value="share">Поделиться</option><option value="share-error">Ошибка копирования</option><option value="delete">Удаление · подтверждение</option><option value="deleting">Удаление · загрузка</option><option value="delete-error">Удаление · ошибка</option><option value="deleted">Событие недоступно</option><option value="notifications">Настройки уведомлений</option><option value="notification-denied">Нет разрешения Telegram</option><option value="notification-error">Ошибка сохранения настроек</option></select></label></div><div id="stage" class="stage"></div></div><dialog id="modal" aria-labelledby="modal-title"></dialog><div class="sr" id="announce" aria-live="polite" role="status"></div><script>history.replaceState(null,'',location.pathname+'?screen=07');</script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),state=$('#state'),modal=$('#modal'),params=new URLSearchParams(location.search),embed=params.has('embed');if(embed)document.body.classList.add('embed');let view='manage',busy=false,timer,originButton=null,notificationPermission=false,notificationOn=true;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let event={title:'День рождения Анны',date:'2026-10-12',time:'18:00',end:'21:00',place:'Ресторан «La Prima»',address:'Москва, Большая Дмитровка, 7',directions:'Вход со двора, второй этаж. На входе скажите, что вы к Анне.',description:'Отметим вместе: любимые люди, вкусный ужин и много тёплых разговоров.',dress:'Светлые цвета и хорошее настроение',timezone:'Europe/Moscow',cover:''};if(params.has('created')||params.has('updated')){try{event=JSON.parse(sessionStorage.getItem('fe-management-event')||'{}');state.value=params.has('created')?'new':'ready'}catch{}}const guests=[['АМ','Анна Морозова','Будут','2 взрослых · 1 ребёнок'],['ДС','Дмитрий Соколов','Пока не знают','1 взрослый'],['ЕК','Елена Кузнецова','Не будут','Ответ получен сегодня']];const disabled=()=>['offline','expired','loading','deleted'].includes(state.value)||busy;const button=(text,action,kind='secondary',dis=false)=>`<button type="button" class="${kind}" data-action="${action}" ${dis?'disabled':''}>${text}</button>`;const dateText=()=>{const d=new Date(event.date+'T12:00:00');return Number.isNaN(+d)?event.date:new Intl.DateTimeFormat('ru',{day:'numeric',month:'long',year:'numeric'}).format(d)};function render(){const s=state.value,empty=['new','empty'].includes(s),minimal=s==='minimal',isPast=s==='past';const host=$('#platform').value==='mini'?'<div class="host">Telegram · системная область Mini App</div>':'';const header='<header class="header"><div class="brand"><span aria-hidden="true">♡</span>Family Events</div>'+button('АШ','profile','avatar')+'</header>';let content='';if(s==='loading'){content='<h1 class="heading">Управление событием</h1><p role="status">Загружаем событие…</p><div aria-hidden="true"><div class="skeleton large"></div><div class="skeleton"></div><div class="skstats"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>'}else if(['error','deleted'].includes(s)){content=`<div class="panel"><h1 class="heading">${s==='error'?'Не удалось загрузить событие':'Событие недоступно'}</h1><p class="empty-copy">${s==='error'?'Проверьте соединение и попробуйте снова.':'Возможно, оно удалено или у вас нет доступа к управлению.'}</p>${s==='error'?button('Попробовать снова','retry','primary'):button('Мои события','back','primary')}</div>`}else if(view==='guests'){content=`<div class="subscreen">${button('← К событию','manage','back')}<h1 class="heading">Ответы гостей</h1><p class="intro">Персональные ответы видны только организатору.</p><div class="panel">${guestRows()}<p class="hint">Макет перехода к полному списку. Фильтры и редактирование ответов проектируются отдельно.</p></div></div>`}else if(view==='wishlist'){content=`<div class="subscreen">${button('← К событию','manage','back')}<h1 class="heading">Wishlist события</h1><p class="intro">${empty?'Добавьте идеи подарков для гостей.':'6 подарков · 2 выбраны'}</p><div class="panel"><h2>Режим сюрприза</h2><p class="privacy">Организатор видит количество выбранных подарков, но не имена выбравших.</p>${button('Открыть макет создания вишлиста','wishlist-create','primary')}</div></div>`}else{let notice='';if(s==='new')notice='<div class="notice" role="status"><strong>Событие создано.</strong> Теперь пригласите близких — они смогут ответить без регистрации.</div>';if(s==='refresh')notice='<div class="banner" role="alert">Не удалось обновить данные. Показываем ранее загруженные сведения.'+button('Повторить обновление','retry')+'</div>';if(s==='offline')notice='<div class="banner" role="status">Нет соединения. Просмотр сохранённых сведений доступен; изменения временно недоступны.'+button('Проверить соединение','retry')+'</div>';if(s==='expired')notice='<div class="banner" role="alert">Сессия истекла. Войдите снова, чтобы управлять событием.'+button('Войти через Telegram','relogin')+'</div>';content=notice+`<div class="management-layout"><section aria-label="Сведения о событии"><div class="hero" aria-hidden="true">${event.cover?`<img src="${esc(event.cover)}" alt="">`:'🎂'}</div><span class="pill">${isPast?'Прошедшее':'Предстоящее'}</span><h1 class="heading">${esc(event.title)}</h1><p class="metadata">${dateText()}${!minimal&&event.time?' · '+esc(event.time)+(event.end?'–'+esc(event.end):''):''}</p>${!minimal&&event.time?`<p class="hint">Время события · ${esc(event.timezone)}</p>`:''}${!minimal&&event.place?`<p class="metadata">${esc(event.place)}</p>`:''}<div class="action-row">${button('Редактировать','edit','secondary',disabled())}${button('Поделиться','share','primary',disabled())}<button type="button" class="secondary more" data-action="menu" aria-label="Другие действия с событием" ${disabled()?'disabled':''}>•••</button></div>${!minimal?`<dl class="details">${event.address?`<dt>Адрес</dt><dd>${esc(event.address)}</dd>`:''}${event.directions?`<dt>Как найти</dt><dd>${esc(event.directions)}</dd>`:''}${event.description?`<dt>Описание</dt><dd>${esc(event.description)}</dd>`:''}${event.dress?`<dt>Dress code</dt><dd>${esc(event.dress)}</dd>`:''}</dl>`:''}</section><div class="dashboard"><section class="panel" aria-labelledby="summary-title"><h2 id="summary-title">Ответы на приглашение</h2><div class="stats">${[['Будут',empty?'0':'8'],['Не будут',empty?'0':'2'],['Пока не знают',empty?'0':'3']].map(([t,n])=>`<div class="stat"><b>${n}</b><span>${t}</span></div>`).join('')}</div><p class="totals">Подтвердили: ${empty?'0 взрослых · 0 детей':'11 взрослых · 4 ребёнка'}</p><p class="hint">Взрослые и дети учитываются только в ответах «Будут». Числа сверху — количество ответов.</p></section><section class="panel" aria-labelledby="guests-title"><div class="section-title"><h2 id="guests-title">Гости</h2><span>${empty?'0':'13'} ответов</span></div>${s==='guests-error'?'<p class="error" role="alert">Не удалось загрузить ответы гостей.</p>'+button('Повторить','retry-block','secondary'):empty?'<p class="empty-copy">Пока никто не ответил на приглашение. Отправьте ссылку близким.</p>':guestRows()}${button('Посмотреть всех','guests','secondary block-action',empty||s==='guests-error')}<p class="hint">Имена гостей доступны только вам.</p></section><section class="panel" aria-labelledby="wishlist-title"><h2 id="wishlist-title">Wishlist</h2>${s==='wishlist-error'?'<p class="error" role="alert">Не удалось загрузить сведения о подарках.</p>'+button('Повторить','retry-block'):empty?'<p class="empty-copy">Wishlist пока пуст. Добавьте идеи подарков, чтобы гостям было проще выбрать.</p>':`<div class="wishlist-numbers"><div><b>6</b><span>подарков</span></div><div><b>2</b><span>выбраны</span></div></div><p class="privacy">Режим сюрприза: имена выбравших скрыты.</p>`}${button('Управлять wishlist','wishlist','secondary block-action',disabled())}</section><section class="panel" aria-labelledby="invitation-title"><h2 id="invitation-title">Пригласите близких</h2><p class="empty-copy">Одна ссылка — вся информация и ответ на приглашение. Гостям не нужна регистрация.</p>${button('Пригласить гостей','share','primary block-action',disabled())}</section>${button('Настройки уведомлений','notifications','secondary',disabled())}</div></div>`}$('#stage').style.width=$('#width').value+'px';$('#stage').innerHTML=host+header+`<main class="content" ${s==='loading'?'aria-busy="true"':''}>${button('← Мои события','back','back')}${content}</main>`;}function guestRows(){return guests.map(([initial,name,status,detail])=>`<div class="respondent"><span class="initial" aria-hidden="true">${initial}</span><div><strong>${name}</strong><p>${detail}</p></div><span class="response-status">${status}</span></div>`).join('')}function openModal(title,body){originButton=document.activeElement;modal.innerHTML='<button type="button" class="dialog-close" data-action="modal-close" aria-label="Закрыть диалог">×</button><h2 id="modal-title">'+title+'</h2>'+body;if(!modal.open)modal.showModal();modal.querySelector('button:not(.dialog-close),input')?.focus()}function closeModal(){if(busy)return;modal.close();originButton?.focus()}function share(){openModal('Пригласить гостей','<p>Гости откроют приглашение и ответят без регистрации.</p><div class="notice">Макет: публичная ссылка ещё не опубликована. Подключение сервера сделает её доступной на других устройствах.</div>'+button('Поделиться приглашением','share-native','primary')+button('Скопировать ссылку','copy')+'<p class="feedback" id="modal-feedback" role="status"></p>')}function deletion(error=false){openModal('Удалить событие?',`<p>Удалить «${esc(event.title)}»?</p><p class="modal-copy">Ссылка на мероприятие перестанет работать. Это действие нельзя отменить.</p>${error?'<p class="error" role="alert">Не удалось удалить событие. Оно остаётся доступным. Попробуйте снова.</p>':''}${button('Отмена','modal-close','secondary')}${button('Удалить событие','confirm-delete','danger')}<p class="feedback" id="modal-feedback" role="status"></p>`)}function notifications(){openModal('Уведомления',`<p class="modal-copy">Новые и изменённые ответы гостей приходят в Telegram.</p>${notificationPermission?'':`<div class="notice">Разрешите сообщения от бота Family Events в Telegram.</div>${button('Разрешить в Telegram','permission','primary')}`}<label class="toggle-row" for="notify"><span>Новые ответы гостей</span><input type="checkbox" id="notify" ${notificationOn?'checked':''} ${notificationPermission?'':'disabled'}></label><p class="hint">Переключатель применяется к новым и изменённым RSVP.</p>${button('Сохранить','save-notifications','primary',!notificationPermission)}<p class="feedback" id="modal-feedback" role="status"></p>`)}function back(){if(embed)parent.postMessage({source:'family-events-manage',action:'back'},location.protocol==='file:'?'*':location.origin);else location.href='02-my-events.html'}document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='back')back();if(a==='profile')openModal('Организатор','<p>Переход к профилю Telegram. Экран профиля проектируется отдельно.</p>'+button('Закрыть','modal-close'));if(a==='manage'){view='manage';render()}if(a==='guests'){location.href='12-guest-list.html';return}if(a==='wishlist'){location.href='13-wishlist-management.html';return;view=a;render();$('#stage h1').setAttribute('tabindex','-1');$('#stage h1').focus()}if(a==='wishlist-create')location.href='wishlist-create.html';if(a==='share'){location.href='19-share-invitation.html'}if(a==='menu')openModal('Действия с событием',button('Удалить событие','delete','danger')+button('Отмена','modal-close'));if(a==='delete')deletion();if(a==='modal-close')closeModal();if(a==='notifications'){location.href='20-telegram-notifications.html?role=organizer'}if(a==='edit'){openModal('Редактировать событие','<p>Для редактирования используется форма экрана 03 с текущими данными события.</p>'+button('Открыть форму','edit-form','primary')+'<p class="hint">Форма заполнена текущими данными. После значимых изменений можно уведомить подписанных гостей.</p>')}if(a==='edit-form'){sessionStorage.setItem('fe-edit-event',JSON.stringify(event));location.href='05-edit-event.html'}if(a==='copy'||a==='share-native'){$('#modal-feedback').textContent=state.value==='share-error'?'Не удалось скопировать ссылку. Попробуйте снова или поделитесь вручную.':'Демонстрационный переход: после подключения сервера здесь будет постоянная ссылка приглашения.'}if(a==='permission'){if(state.value==='notification-denied'){$('#modal-feedback').textContent='Разрешение не получено. Вы можете разрешить сообщения позже.';return}notificationPermission=true;notifications()}if(a==='save-notifications'){busy=true;b.disabled=true;b.innerHTML='<span class="spinner" aria-hidden="true"></span>Сохраняем…';modal.setAttribute('aria-busy','true');timer=setTimeout(()=>{busy=false;modal.removeAttribute('aria-busy');if(state.value==='notification-error'){b.disabled=false;b.textContent='Повторить сохранение';$('#modal-feedback').textContent='Не удалось сохранить настройки. Попробуйте снова.'}else{notificationOn=$('#notify').checked;$('#modal-feedback').textContent='Настройки сохранены в макете';b.disabled=false;b.textContent='Сохранить'}},700)}if(a==='confirm-delete'){busy=true;modal.querySelectorAll('button').forEach(el=>el.disabled=true);b.innerHTML='<span class="spinner" aria-hidden="true"></span>Удаляем…';modal.setAttribute('aria-busy','true');timer=setTimeout(()=>{busy=false;modal.removeAttribute('aria-busy');if(state.value==='delete-error'){deletion(true)}else{modal.close();state.value='deleted';render();$('#announce').textContent='Событие удалено в макете. Можно вернуться к списку.'}},900)}if(a==='retry'||a==='retry-block'||a==='relogin'){state.value='loading';render();timer=setTimeout(()=>{state.value='ready';render();$('#announce').textContent='Данные обновлены в макете'},700)}});modal.addEventListener('cancel',e=>{if(busy)e.preventDefault()});modal.addEventListener('close',()=>originButton?.focus());state.onchange=()=>{clearTimeout(timer);busy=false;modal.removeAttribute('aria-busy');if(modal.open)modal.close();view='manage';render();switch(state.value){case 'share':case 'share-error':share();break;case 'delete':deletion();break;case 'delete-error':deletion(true);break;case 'deleting':deletion();busy=true;modal.querySelectorAll('button').forEach(el=>el.disabled=true);modal.querySelector('[data-action=confirm-delete]').innerHTML='<span class="spinner" aria-hidden="true"></span>Удаляем…';modal.setAttribute('aria-busy','true');break;case 'notifications':notificationPermission=true;notifications();break;case 'notification-denied':notificationPermission=false;notifications();break;case 'notification-error':notificationPermission=true;notifications();$('#modal-feedback').textContent='Не удалось сохранить настройки. Выбранное значение сохранено в форме.';break;}};$('#width').onchange=render;$('#platform').onchange=render;window.addEventListener('message',e=>{if(e.source!==parent||e.data?.source!=='family-events-host')return;if(e.data.action==='init'){event=e.data.newEvent?e.data.event:{...event,...e.data.event};if(e.data.newEvent)state.value='new';render()}});render();if(params.get('screen')==='07'){state.value='delete';state.onchange()}
})();
</script></body></html>
