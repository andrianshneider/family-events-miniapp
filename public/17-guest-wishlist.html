</style></head><body><div class="review"><h1 class="review-title">17 — Wishlist для гостя</h1><p class="review-title">Без авторизации · выбор демонстрационный, сохраняется на этом устройстве</p><div class="controls"><label>Платформа<select id="platform"><option value="web">Web</option><option value="pwa">PWA</option><option value="mini">Telegram Mini App</option></select></label><label>Ширина<select id="width"><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1280</option></select></label><label>Состояние<select id="state"><option value="ready">Свободный / чужой / свой</option><option value="empty">Пустой wishlist</option><option value="detail">Детали подарка</option><option value="loading">Загрузка</option><option value="error">Ошибка загрузки</option><option value="offline">Нет соединения</option><option value="reserving">Выбор · загрузка</option><option value="reserve-error">Ошибка выбора</option><option value="race">Подарок только что выбран</option><option value="cancel">Подтверждение отмены</option><option value="cancelling">Отмена · загрузка</option><option value="cancel-error">Ошибка отмены</option><option value="unavailable">Событие недоступно</option><option value="session-lost">Свой выбор не распознан</option></select></label></div><div class="stage" id="stage"></div></div><dialog id="modal" aria-labelledby="modal-title"></dialog><div class="sr" id="announce" role="status" aria-live="polite"></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),state=$('#state'),modal=$('#modal');const demo=[{id:'headphones',title:'Беспроводные наушники',price:'12990',link:'https://example.com/headphones',status:'free',art:'🎧',description:'Удобная модель для музыки и путешествий. Цвет — светлый.'},{id:'book',title:'Книга о путешествиях',price:'2400',link:'',status:'other',art:'📚',description:'Большое иллюстрированное издание о красивых местах.'},{id:'coffee',title:'Набор для кофе',price:'',link:'',status:'own',art:'☕',description:'Для неторопливых завтраков и уютных вечеров.'}];let gifts=structuredClone(demo),view='list',selected=null,busy=false,timer,returnFocus;try{const saved=JSON.parse(localStorage.getItem('fe-guest-wishlist-demo')||'null');if(saved)gifts=saved}catch{}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(text,action,kind='secondary',disabled=false)=>`<button type="button" class="${kind}" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`;const readonly=()=>state.value==='offline';function save(){try{localStorage.setItem('fe-guest-wishlist-demo',JSON.stringify(gifts));return true}catch{return false}}function actions(g){return g.status==='free'?`<p class="gift-status">Свободен</p><button type="button" class="primary" data-choose="${g.id}" ${readonly()?'disabled':''}>Выбрать</button>`:g.status==='own'?`<p class="own-status">Вы выбрали этот подарок</p><button type="button" class="secondary" data-cancel="${g.id}" ${readonly()?'disabled':''}>Отменить выбор</button>`:'<p class="gift-status reserved">Уже выбран</p>'}function card(g){return `<article class="gift-card"><div class="gift-photo" aria-hidden="true">${g.art}</div><div class="gift-body"><button type="button" class="gift-title-button" data-detail="${g.id}" aria-label="Детали подарка: ${esc(g.title)}">${esc(g.title)} ›</button>${g.price?`<p class="price">${Number(g.price).toLocaleString('ru-RU')} ₽</p>`:''}${actions(g)}</div></article>`}function render(){let s=state.value,content=btn('← К событию','event','back')+'<h1 class="heading">Что подарить</h1><p class="intro">День рождения Анны</p>';if(s==='loading')content+='<p role="status">Загружаем подарки…</p><div class="gift-grid" aria-hidden="true"><div class="skeleton"></div><div class="skeleton"></div></div>';else if(['error','unavailable'].includes(s))content+=`<section class="empty-wishlist" role="alert"><h2>${s==='error'?'Не удалось загрузить wishlist':'Это мероприятие недоступно'}</h2><p>${s==='error'?'Проверьте соединение и попробуйте снова.':'Возможно, событие удалено. Уточните приглашение у отправителя.'}</p>${s==='error'?btn('Попробовать снова','retry','primary'):''}</section>`;else{if(s==='offline')content+='<div class="banner" role="status">Нет соединения. Статусы могут быть неактуальны. Выбор и отмена временно недоступны.'+btn('Проверить соединение','retry')+'</div>';if(s==='session-lost')content+='<div class="notice">На этом устройстве прежний выбор не распознан. Откройте приглашение в браузере, где выбирали подарок. Регистрация не требуется.</div>';if(view==='detail'){const g=gifts.find(x=>x.id===selected)||gifts[0];content=btn('← К wishlist','list','back')+`<section class="gift-detail"><div class="gift-photo" aria-hidden="true">${g.art}</div><h1 class="heading">${esc(g.title)}</h1>${g.price?`<p class="price">${Number(g.price).toLocaleString('ru-RU')} ₽</p>`:''}<p class="gift-description">${esc(g.description)}</p>${g.link?`<a class="gift-link" href="${esc(g.link)}" target="_blank" rel="noopener noreferrer" aria-label="Открыть ссылку на ${esc(g.title)} в новой вкладке">Открыть ссылку ↗</a>`:''}<div class="gift-body">${actions(g)}</div></section>`;if(s==='offline')content='<div class="banner" role="status">Нет соединения. Выбор и отмена недоступны.</div>'+content}else content+='<p class="privacy-note">Имена выбравших подарки скрыты. Выбор закрепляется за этим устройством.</p>'+(s==='empty'?'<div class="empty-wishlist"><h2>Wishlist пока пуст</h2><p>Организатор ещё не добавил идеи подарков. Загляните позже.</p>'+btn('Вернуться к событию','event','primary')+'</div>':`<div class="gift-grid">${gifts.map(card).join('')}</div>`)}$('#stage').style.width=$('#width').value+'px';$('#stage').innerHTML=($('#platform').value==='mini'?'<div class="host">Telegram · системная область Mini App</div>':'')+'<header class="header"><div class="brand"><span aria-hidden="true">♡</span>Family Events</div></header>'+`<main class="content" ${s==='loading'?'aria-busy="true"':''}>${content}</main>`}function open(title,body){returnFocus=document.activeElement;modal.innerHTML='<h2 id="modal-title">'+title+'</h2>'+body;if(!modal.open)modal.showModal();modal.querySelector('button')?.focus()}function reserve(g){if(busy||g.status!=='free')return;open('Выбрать подарок',`<p>«${esc(g.title)}»</p><p class="modal-copy">Выбор означает, что вы планируете подарить его. Покупка и оплата происходят отдельно.</p><p class="feedback" id="feedback" role="status">Закрепляем подарок за вами…</p>`);busy=true;modal.setAttribute('aria-busy','true');timer=setTimeout(()=>{busy=false;modal.removeAttribute('aria-busy');if(state.value==='race'){g.status='other';render();modal.innerHTML='<h2 id="modal-title">Подарок уже выбран</h2><p>Этот подарок только что выбрал другой гость. Выберите другой подарок.</p>'+btn('Выбрать другой','close','primary');return}if(state.value==='reserve-error'||!navigator.onLine){modal.innerHTML='<h2 id="modal-title">Не удалось выбрать подарок</h2><p>Проверьте соединение и попробуйте снова. Подарок ещё не закреплён за вами.</p><button type="button" class="primary" data-choose="'+g.id+'">Повторить</button>'+btn('Закрыть','close');return}g.status='own';if(!save()){g.status='free';modal.innerHTML='<h2 id="modal-title">Выбор не сохранён</h2><p>Не удалось сохранить выбор в этом браузере. Попробуйте снова.</p>'+btn('Закрыть','close');return}render();modal.innerHTML='<h2 id="modal-title">Вы выбрали подарок</h2><p>В макете он закреплён за вами на этом устройстве. При необходимости выбор можно отменить.</p>'+btn('К wishlist','close','primary');$('#announce').textContent='Подарок выбран в макете'},800)}function cancelGift(g,error=false){open('Отменить выбор?',`<p>Подарок «${esc(g.title)}» снова станет свободным для остальных гостей.</p>${error?'<p class="error" role="alert">Не удалось отменить выбор. Подарок остаётся за вами. Попробуйте снова.</p>':''}${btn('Оставить выбор','close','primary')}<button type="button" class="secondary" id="cancel-confirm">Отменить выбор</button>`);$('#cancel-confirm').onclick=()=>{busy=true;modal.setAttribute('aria-busy','true');modal.querySelectorAll('button').forEach(x=>x.disabled=true);$('#cancel-confirm').innerHTML='<span class="spinner" aria-hidden="true"></span>Отменяем…';timer=setTimeout(()=>{busy=false;modal.removeAttribute('aria-busy');if(state.value==='cancel-error'||!navigator.onLine){cancelGift(g,true);return}g.status='free';if(!save()){g.status='own';cancelGift(g,true);return}modal.close();render();$('#announce').textContent='Выбор отменён. Подарок свободен'},750)}}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||busy)return;if(b.dataset.detail){location.href='18-gift-detail.html?gift='+encodeURIComponent(b.dataset.detail);return}if(b.dataset.choose){reserve(gifts.find(g=>g.id===b.dataset.choose));return}if(b.dataset.cancel){cancelGift(gifts.find(g=>g.id===b.dataset.cancel));return}const a=b.dataset.action;if(a==='event')location.href='08-public-event.html';if(a==='list'){view='list';render()}if(a==='close'){modal.close();render()}if(a==='retry'){state.value='loading';render();timer=setTimeout(()=>{state.value='ready';render()},650)}});modal.addEventListener('cancel',e=>{if(busy)e.preventDefault()});modal.addEventListener('close',()=>returnFocus?.focus());state.onchange=()=>{clearTimeout(timer);busy=false;modal.removeAttribute('aria-busy');if(modal.open)modal.close();gifts=structuredClone(demo);view='list';if(state.value==='session-lost')gifts[2].status='other';if(state.value==='detail'){view='detail';selected='headphones'}render();if(['reserving','reserve-error','race'].includes(state.value)){if(state.value==='reserving'){open('Выбрать подарок','<p role="status"><span class="spinner" aria-hidden="true"></span>Закрепляем подарок за вами…</p>');busy=true;modal.setAttribute('aria-busy','true')}else reserve(gifts[0])}if(['cancel','cancelling','cancel-error'].includes(state.value)){cancelGift(gifts[2],state.value==='cancel-error');if(state.value==='cancelling'){busy=true;modal.setAttribute('aria-busy','true');modal.querySelectorAll('button').forEach(x=>x.disabled=true);$('#cancel-confirm').innerHTML='<span class="spinner" aria-hidden="true"></span>Отменяем…'}}};$('#width').onchange=render;$('#platform').onchange=render;render()})();
</script></body></html>
