(()=>{'use strict';const $=s=>document.querySelector(s),state=$('#state'),role=$('#role'),platform=$('#platform'),modal=$('#modal');let connected=false,enabled=false,busy=false,timer;const btn=(text,action,kind='secondary',disabled=false)=>`<button type="button" class="${kind}" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`;const templates=[['Новый ответ · организатор','🎉 Анна будет на мероприятии\nДень рождения Макса\n2 взрослых · 1 ребёнок','Открыть событие','event'],['Изменение ответа · организатор','🔄 Анна изменила ответ\nБыло: Буду\nТеперь: Не буду\nДень рождения Макса','Открыть гостей','guests'],['Значимое изменение · гость','⚠️ Изменилась информация о мероприятии\nДень рождения Макса\nНовое время: 16:00','Посмотреть событие','public'],['За 24 часа · гость','🎉 Завтра День рождения Макса\n18 октября · 15:00\nKids City','Открыть мероприятие','public']];function render(){const s=state.value,guest=role.value==='guest',mini=platform.value==='mini',pending=busy||['permission','linking','saving'].includes(s);let panel='<div class="connect-icon" aria-hidden="true">♧</div><h2>'+ (guest?'Получать напоминания в Telegram':'Уведомления')+'</h2><p>'+(guest?'Получайте напоминание за 24 часа и сообщения о важных изменениях встречи.':'Получайте новые и изменённые ответы гостей в Telegram.')+'</p>';panel+='<div class="event-context">День рождения Макса · 18 октября<br>Ваш ответ: '+(guest?(s==='rsvp-no'?'Не буду':'Буду'):'организатор')+'</div>';if(['denied','error','expired','wrong-account','offline','revoked','save-error'].includes(s)){const texts={denied:'Разрешение не получено. Можно подключить уведомления позже.',error:'Не удалось подключить Telegram. Проверьте соединение и попробуйте снова.',expired:'Ссылка подключения истекла. Создайте новую ссылку, чтобы продолжить.', 'wrong-account':'В Telegram открыт другой аккаунт. Вернитесь и выберите нужный аккаунт перед привязкой.',offline:'Нет соединения. Подключение временно недоступно.',revoked:'Бот больше не <section class="connect-panel" '+(pending?'aria-busy="true"':'')+'>'+panel+'</section><section class="templates-section" aria-label="Шаблоны Telegram-сообщений"><h2>Как выглядят сообщения</h2><p class="hint">Preview четырёх шаблонов. Реальные сообщения отправляются только после разрешения.</p><div class="templates">'+templates.map(([label,text,cta,action])=>'<div><p class="template-label">'+label+'</p><article class="telegram-message"><h3>Family Events</h3><p>'+text+'</p>'+btn(cta,action)+'</article></div>').join('')+'</div></section></div>';$('#stage').style.width=$('#width').value+'px';$('#stage').innerHTML=(mini?'<div class="host">Telegram · системная область Mini App</div>':'')+'<header class="header"><div class="brand"><span aria-hidden="true">♡</span>Family Events</div></header><main class="content">'+content+'</main>';if($('#notification-toggle'))$('#notification-toggle').onchange=e=>{const old=enabled,value=e.target.checked;e.target.disabled=true;$('#feedback').textContent='Сохраняем…';timer=setTimeout(()=>{if(s==='save-error'){enabled=old;render();$('#feedback').textContent='Не удалось сохранить. Прежнее значение сохранено. Повторите попытку.'}else{enabled=value;try{localStorage.setItem('fe-notifications-demo-'+role.value,JSON.stringify({connected,enabled}))}catch{}render();$('#notification-toggle').focus();$('#feedback').textContent='Настройка сохранена в макете'}},650)}}function connect(){if(platform.value==='mini'){modal.innerHTML='<h2 id="modal-title">Разрешить сообщения?</h2><p>Preview системного запроса Telegram: бот Family Events сможет отправлять вам сообщения.</p>'+btn('Разрешить','allow','primary')+btn('Не разрешать','deny');modal.showModal()}else{state.value='waiting';render();modal.innerHTML='<h2 id="modal-title">Продолжить в Telegram</h2><p>В рабочем приложении откроется бот с одноразовой ссылкой подключения.</p><ol class="step-list"><li>Открыть бота.</li><li>Подтвердить привязку гостевой сессии.</li><li>Разрешить сообщения и вернуться.</li></ol><p class="hint">Сейчас это демонстрация, аккаунт не привязывается.</p>'+btn('Подтвердить подключение в макете','allow','primary')+btn('Отмена','cancel');modal.showModal()}}function allow(){modal.close();state.value='linking';render();timer=setTimeout(()=>{connected=true;enabled=true;state.value='connected';render();$('#announce').textContent='Telegram подключён в макете. Уведомления включены'},750)}document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='connect')connect();if(a==='allow')allow();if(a==='deny'){modal.close();state.value='denied';render()}if(a==='cancel'){modal.close();state.value='idle';render()}if(a==='check'){modal.innerHTML='<h2 id="modal-title">Подключение ещё не подтверждено</h2><p>Завершите действие в Telegram и повторите проверку.</p>'+btn('Вернуться','close','primary');modal.showModal()}if(a==='close')modal.close();if(a==='back')location.href=role.value==='guest'?'08-public-event.html':'04-event-management.html';if(a==='event')location.href='04-event-management.html';if(a==='guests')location.href='12-guest-list.html';if(a==='public')location.href='08-public-event.html'});state.onchange=()=>{clearTimeout(timer);busy=false;if(modal.open)modal.close();connected=['connected','off','rsvp-no','save-error'].includes(state.value);enabled=connected&&state.value!=='off';render()};if(new URLSearchParams(location.search).get('role')==='organizer')role.value='organizer';role.onchange=()=>{clearTimeout(timer);connected=false;enabled=false;state.value='idle';render()};platform.onchange=render;$('#width').onchange=render;render()})();
